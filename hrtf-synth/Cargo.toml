[package]
name = "hrtf-synth"
version = "0.1.0"
edition = "2021"
authors = ["HRTF Synthesis Project"]
description = "Synthesize personalized HRTFs from anthropometric measurements"
license = "MIT"
repository = "https://github.com/matbeedotcom/Realtime_Game_Audio_HRTF_Synthesis"
keywords = ["hrtf", "audio", "binaural", "spatial-audio"]
categories = ["multimedia::audio", "science"]

[dependencies]
# Linear algebra
nalgebra = { version = "0.33", features = ["serde-serialize"] }

# FFT
rustfft = "6.2"
num-complex = "0.4"

# Audio I/O
hound = "3.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI (optional — not needed when used as a library)
clap = { version = "4.5", features = ["derive"], optional = true }
rayon = { version = "1.10", optional = true }
indicatif = { version = "0.17", optional = true }

[dev-dependencies]
approx = "0.5"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:rayon", "dep:indicatif"]
gui = ["cli", "dep:eframe", "dep:egui", "dep:rfd", "dep:windows", "dep:windows-core"]
sofa = ["dep:hdf5"]

[dependencies.eframe]
version = "0.29"
optional = true

[dependencies.egui]
version = "0.29"
optional = true

[dependencies.rfd]
version = "0.15"
optional = true

[dependencies.hdf5]
version = "0.8"
optional = true

[dependencies.windows]
version = "0.58"
optional = true
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_FunctionDiscovery",
]

[dependencies.windows-core]
version = "0.58"
optional = true

[[bin]]
name = "hrtf-synth"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "hrtf-synth-gui"
path = "src/gui_main.rs"
required-features = ["gui"]
