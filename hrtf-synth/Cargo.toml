[package]
name = "hrtf-synth"
version = "0.1.0"
edition = "2021"
authors = ["HRTF Synthesis Project"]
description = "Synthesize personalized HRTFs from anthropometric measurements"
license = "MIT"
repository = "https://github.com/your-username/hrtf-synth"
keywords = ["hrtf", "audio", "binaural", "spatial-audio"]
categories = ["multimedia::audio", "science"]

[dependencies]
# Linear algebra
nalgebra = { version = "0.33", features = ["serde-serialize"] }

# FFT
rustfft = "6.2"
num-complex = "0.4"

# Audio I/O
hound = "3.5"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Parallel processing
rayon = "1.10"

# Progress bar
indicatif = "0.17"

[dev-dependencies]
# Testing
approx = "0.5"

[features]
default = []
# Optional GUI support
gui = ["dep:eframe", "dep:egui", "dep:rfd"]
# SOFA file support (requires HDF5)
sofa = ["dep:hdf5"]

[dependencies.eframe]
version = "0.29"
optional = true

[dependencies.egui]
version = "0.29"
optional = true

[dependencies.rfd]
version = "0.15"
optional = true

[dependencies.hdf5]
version = "0.8"
optional = true

[[bin]]
name = "hrtf-synth"
path = "src/main.rs"

[[bin]]
name = "hrtf-synth-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
