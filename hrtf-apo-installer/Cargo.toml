[package]
name = "hrtf-apo-installer"
version = "0.1.0"
edition = "2021"
description = "Installer and registration tool for the HRTF APO"
license = "MIT"

[[bin]]
name = "hrtf-apo-installer"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Com_StructuredStorage",
]}
windows-core = "0.58"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
embed-resource = "3"

[build-dependencies]
embed-resource = "3"
